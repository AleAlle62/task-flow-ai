# The default six-phase pipeline.
#
# This file describes ONLY the flow: which phase runs when, what it receives,
# what it produces, and where the pipeline stops for a human.
#
# It deliberately says nothing about which agent, provider or model runs
# underneath. Those belong to whoever is running the pipeline, not to the
# pipeline itself — the same six phases in the same order hold whatever is
# below them.
#
#   - the agent underneath is the one you already have installed
#   - the model comes from --model or the agent's own default
#   - what each phase may do is declared in agents/<id>.md, on the
#     "capabilities" line, which is what stops five phases out of six from
#     changing your code. Those are this tool's own words, not any product's
#     tool names — a provider translates them.
#
# Adding a phase is five lines here plus a file in agents/. You should never
# need to touch the code to change how the pipeline behaves.

defaults:
  timeout: 600 # seconds a single phase may run before it is killed

# The only paths the writing phase may touch, relative to the target project.
# Checked after that phase runs, not prevented: anything it touched outside this
# list is named for you and left exactly as it was written.
write_paths:
  - "**"

# Each id is the name of a file in agents/. The order here is the order they run.
phases:
  - id: intake-ai
    inputs: [task]
    output: spec.md

  - id: explore-ai
    inputs: [task, spec.md]
    output: map.md

  - id: plan-ai
    inputs: [spec.md, map.md]
    output: plan.md
    # The one stop where a human decides. Nothing has been written yet.
    gate:
      show: plan.md
      options: [Approve, Reject]

  - id: implement-ai
    inputs: [plan.md, gates.plan-ai.note]
    output: report.md

  - id: review-ai
    inputs: [spec.md, report.md, diff]
    output: review.md
    # Blocking findings send the work back. Twice at most: a third round means
    # the plan was wrong, not the code, and that is the user's call.
    on_findings:
      severity: [blocking]
      goto: implement-ai
      max_loops: 2

  - id: security-ai
    inputs: [diff]
    output: security.md
    # A vulnerability is sent back to be fixed, not handed to you to decide
    # about. The same rule as the review above, and the same limit: after two
    # rounds the problem is the plan, not the code.
    on_findings:
      severity: [critical, high]
      goto: implement-ai
      max_loops: 2
